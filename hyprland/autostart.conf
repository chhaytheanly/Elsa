exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = sh -c '[ -x /usr/libexec/xdg-desktop-portal-hyprland ] && exec /usr/libexec/xdg-desktop-portal-hyprland; [ -x /usr/lib/xdg-desktop-portal-hyprland ] && exec /usr/lib/xdg-desktop-portal-hyprland; true'
exec-once = sh -c '[ -x /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1 ] && exec /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1; [ -x /usr/libexec/policykit-1-gnome/polkit-gnome-authentication-agent-1 ] && exec /usr/libexec/policykit-1-gnome/polkit-gnome-authentication-agent-1; true'

exec-once = hyprctl setcursor Adwaita 24

# hyprpaper handles the wallpaper; leave swaybg disabled to avoid overriding it.
# exec-once = swaybg -c '#101014'
exec-once = waybar -c ~/.config/hypr/waybar/config -s ~/.config/hypr/waybar/style.css
exec-once = mako

exec-once = sh -c 'command -v nm-applet >/dev/null && nm-applet --indicator'

exec-once = hyprpaper --config ~/.config/hypr/hyprland/hyprpaper.conf